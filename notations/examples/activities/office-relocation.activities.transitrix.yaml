notation: activities
spec_version: "0.1"

title: Office Relocation — HQ Move 2026
description: |
  HQ move from Building A to Building B. Three phases (planning, fit-out,
  move) grouped via `parent`; two milestones (lease signed, new HQ opens)
  modelled as zero-duration activities per §5.9. The `project:` block
  anchors the schedule for Gantt projection (working-day calendar with
  one holiday), making this example renderable in both the network view
  and the Gantt view.

  Critical path runs through site selection → lease → construction
  permits → construction work → IT install → pack-up → physical move →
  unpack → opening day. Interior design and furniture delivery sit on
  parallel sub-paths and carry slack.
version: "0.1"
date: "2026-05-26"
author: "Valerii Korobeinikov"

project:
  start_date: 2026-06-01
  calendar:
    working_days: [mon, tue, wed, thu, fri]
    hours_per_day: 8
    holidays:
      - "2026-07-04"

activities:
  # ---------------------------------------------------------------------
  # Phase 1 — Planning
  # ---------------------------------------------------------------------
  - id: PHASE-PLANNING
    name: Planning phase
    # No own duration / dates — rolled up from children (see §5.10).

  - id: A-101
    name: Requirements gathering
    parent: PHASE-PLANNING
    duration: 10
    goals: [GOAL-RELOC-001]
    unit: UNIT-FACILITIES
    tags: [planning]

  - id: A-102
    name: Site selection
    parent: PHASE-PLANNING
    duration: 15
    predecessors: [A-101]
    goals: [GOAL-RELOC-001]
    unit: UNIT-FACILITIES
    tags: [planning]

  - id: A-103
    name: Lease negotiation
    parent: PHASE-PLANNING
    duration: 10
    predecessors: [A-102]
    goals: [GOAL-RELOC-001]
    unit: UNIT-LEGAL
    tags: [planning, legal]

  - id: M-LEASE-SIGNED
    name: Lease signed
    duration: 0                       # milestone (see §5.9)
    predecessors: [A-103]
    goals: [GOAL-RELOC-001]
    tags: [milestone]

  # ---------------------------------------------------------------------
  # Phase 2 — Fit-out
  # ---------------------------------------------------------------------
  - id: PHASE-FITOUT
    name: Fit-out phase

  - id: A-201
    name: Construction permits
    parent: PHASE-FITOUT
    duration: 20
    predecessors: [M-LEASE-SIGNED]
    goals: [GOAL-RELOC-001]
    unit: UNIT-LEGAL
    tags: [fit-out, legal]

  - id: A-202
    name: Interior design
    parent: PHASE-FITOUT
    duration: 15
    predecessors: [M-LEASE-SIGNED]
    goals: [GOAL-RELOC-002]
    unit: UNIT-FACILITIES
    tags: [fit-out, design]

  - id: A-203
    name: Construction work
    parent: PHASE-FITOUT
    duration: 30
    predecessors: [A-201, A-202]
    goals: [GOAL-RELOC-001]
    unit: UNIT-FACILITIES
    tags: [fit-out]
    delivers_changes: [CHG-WORKSPACE-001]

  - id: A-204
    name: IT infrastructure install
    parent: PHASE-FITOUT
    duration: 12
    predecessors: [A-203]
    goals: [GOAL-RELOC-002]
    unit: UNIT-IT
    tags: [fit-out, it]
    delivers_changes: [CHG-WORKSPACE-001]

  - id: A-205
    name: Furniture delivery
    parent: PHASE-FITOUT
    duration: 5
    predecessors: [A-203]
    goals: [GOAL-RELOC-002]
    unit: UNIT-FACILITIES
    tags: [fit-out]

  # ---------------------------------------------------------------------
  # Phase 3 — Move
  # ---------------------------------------------------------------------
  - id: PHASE-MOVE
    name: Move phase

  - id: A-301
    name: Pack-up
    parent: PHASE-MOVE
    duration: 3
    predecessors: [A-204, A-205]
    goals: [GOAL-RELOC-001]
    unit: UNIT-FACILITIES
    tags: [move]

  - id: A-302
    name: Physical move
    parent: PHASE-MOVE
    duration: 2
    predecessors: [A-301]
    goals: [GOAL-RELOC-001]
    unit: UNIT-FACILITIES
    tags: [move]

  - id: A-303
    name: Unpacking and setup
    parent: PHASE-MOVE
    duration: 3
    predecessors: [A-302]
    goals: [GOAL-RELOC-001]
    unit: UNIT-FACILITIES
    tags: [move]

  - id: M-OPEN-DAY
    name: New HQ opens
    duration: 0                       # milestone (see §5.9)
    predecessors: [A-303]
    goals: [GOAL-RELOC-001]
    tags: [milestone, public]
