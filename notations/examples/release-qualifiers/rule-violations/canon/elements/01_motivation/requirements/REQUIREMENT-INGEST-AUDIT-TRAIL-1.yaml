id: REQUIREMENT-INGEST-AUDIT-TRAIL-1
name: "Append-only audit trail over telemetry ingest"
description: "Every telemetry record accepted by the platform must be written to an append-only audit trail recording the origin device, the receipt timestamp, and the accepting node, such that no accepted record can later be altered or removed without detection."

