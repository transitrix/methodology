notation: dgca
spec_version: "0.1"
methodology_version: "4.2.0"

id: DGCA-DUPLICATE-GOAL-LINK-1
name: "Goal link duplication — DGCA-021 demonstration"
description: >
  Inline DGCA example demonstrating both positive and negative cases for
  DGCA-021: actions that carry both a direct goal link and a change-path link
  to the same goal.

  Positive case (warns DGCA-021): ACTION-DUPL-POS carries both goals: [GOAL-SHARED-1]
  and delivers_changes: [CHANGE-VIA-GOAL], where CHANGE-VIA-GOAL.goals also
  includes GOAL-SHARED-1. The direct link duplicates the goal reached via the change.

  Negative cases (do not warn):
  - ACTION-DEDUP-ONLY-CHANGE: only delivers a change, no direct goals link
  - ACTION-DEDUP-ONLY-GOAL: only links a goal directly, no delivers_changes
  - ACTION-DEDUP-DISJOINT: has both but the goals in goals[] and those reachable
    via delivers_changes[] are disjoint (no overlap).

period: "2026"
generated_at: "2026-08-30"

factors:
  - id: DRIVER-1
    name: "Driver"
    type: external

goals:
  - id: GOAL-SHARED-1
    name: "Shared goal reachable both ways"
    factors: [DRIVER-1]
  - id: GOAL-ONLY-DIRECT-1
    name: "Goal linked only directly"
    factors: [DRIVER-1]
  - id: GOAL-ONLY-VIA-CHANGE-1
    name: "Goal reached only via change"
    factors: [DRIVER-1]

changes:
  - id: CHANGE-VIA-GOAL
    name: "Change that reaches GOAL-SHARED-1"
    goals: [GOAL-SHARED-1]
  - id: CHANGE-TO-OTHER-GOAL
    name: "Change that reaches GOAL-ONLY-VIA-CHANGE-1"
    goals: [GOAL-ONLY-VIA-CHANGE-1]

actions:
  # POSITIVE: Both direct link and change-path link to the same goal.
  # Emits DGCA-021 warning.
  - id: ACTION-DUPL-POS
    name: "Action with duplicate goal link (positive case)"
    type: Project
    goals: [GOAL-SHARED-1]
    delivers_changes: [CHANGE-VIA-GOAL]

  # NEGATIVE: Only delivers a change, no direct goal link.
  # Does not emit DGCA-021.
  - id: ACTION-DEDUP-ONLY-CHANGE
    name: "Action with only delivers_changes (negative case 1)"
    type: Project
    delivers_changes: [CHANGE-VIA-GOAL]

  # NEGATIVE: Only links a goal directly, no delivers_changes.
  # Does not emit DGCA-021.
  - id: ACTION-DEDUP-ONLY-GOAL
    name: "Action with only goals link (negative case 2)"
    type: Project
    goals: [GOAL-ONLY-DIRECT-1]

  # NEGATIVE: Has both, but goals are disjoint (no overlap).
  # Does not emit DGCA-021.
  - id: ACTION-DEDUP-DISJOINT
    name: "Action with disjoint goals (negative case 3)"
    type: Project
    goals: [GOAL-ONLY-DIRECT-1]
    delivers_changes: [CHANGE-TO-OTHER-GOAL]
