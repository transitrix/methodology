id: REQUIREMENT-DATA-ERASURE-1
name: "Personal-data erasure on user request within 30 days"
description: "On request from a data subject, the system must erase personal data within 30 days. The window starts at the time the request is received and verified — one of the ways the stakeholder-level data-protection obligation is realised at the system tier."
