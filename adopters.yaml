# adopters.yaml — machine-readable registry of downstream consumers of this repo.
# Read by the Discovery job (RELEASING.md, "Discovery — noticing drift on a
# schedule"); never edited by the job itself. Schema and semantics: that
# section's "The downstream-consumer registry — contract".
version: 1
consumers:
  - repo: transitrix/acme-corp
    clone: https://github.com/transitrix/acme-corp.git
    role: reference-adopter
    pin_file: transitrix.yaml
    pin_key: methodology_version
    decisions_path: operations/decisions
