notation: action
spec_version: "0.1"

# Action schedule (Activity-on-Node network). Spec: notations/views/07-action.md
# Actions have string IDs and reference predecessors / goals / changes.
# The compiler computes Early Start / Late Finish / slack and marks
# the critical path. Optional `project.start_date` + per-action
# `duration_days` enable a Gantt projection.

name: "FILL-ME action schedule"
description: "FILL-ME — what this schedule covers"
version: "0.1"
generated_at: "YYYY-MM-DD"
author: "FILL-ME"

project:
  start_date: "2026-06-01"
  calendar:
    working_days: [mon, tue, wed, thu, fri]
    hours_per_day: 8

actions:
  - id: ACTION-DISCOVERY-1
    name: "FILL-ME — first action"
    duration_days: 10
    predecessors: []
    goals: [GOAL-1]               # optional cross-ref to a goal

  - id: ACTION-DESIGN-1
    name: "FILL-ME — second action"
    duration_days: 14
    predecessors: [ACTION-DISCOVERY-1]
    goals: [GOAL-1]

  - id: ACTION-BUILD-1
    name: "FILL-ME — third action"
    duration_days: 30
    predecessors: [ACTION-DESIGN-1]
    delivers_changes: [CHANGE-1]  # optional cross-ref to an FGCA change
