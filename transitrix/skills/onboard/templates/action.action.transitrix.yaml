notation: action
spec_version: "0.1"
methodology_version: "3.0.0"

# Action schedule — pure projection over standalone ACTION elements.
# Spec: notations/views/07-action.md (v2.0). No action data is authored inline.
# Each ACTION-… lives in canon/elements/05_implementation/actions/<ACTION-…>.yaml
# with its own notation:action envelope, admission record, lifecycle, `duration`,
# `predecessors[]`, `goals[]`, `delivers_changes[]`, etc.
#
# The renderer projects two views over the selected elements:
#   - Network view (Activity-on-Node) with critical path (always renderable)
#   - Gantt view (renderable when durations + predecessors + schedule.start_date,
#     or when actions carry pinned start_date/end_date)

id: ACTION_SCHED-FILL-ME-1
name: "FILL-ME action schedule"
description: "FILL-ME — what this schedule covers"
generated_at: "YYYY-MM-DD"

view_config:
  scope:
    root_action: ACTION-FILL-ME-1      # scope to this action and its descendants
    # goals: [GOAL-FILL-ME-1]          # alternative: scope by goal
    # type_filter: [Project, Task]     # alternative: scope by action type
    valid_at: null                     # ISO 8601 date; null = all lifecycle states
  schedule:
    start_date: "2026-06-01"           # project zero-time for computed Gantt
    calendar:                          # optional; defaults: 7-day week, no holidays
      working_days: [mon, tue, wed, thu, fri]
      hours_per_day: 8
  display:
    view: both                         # network | gantt | both
    depth: null                        # integer; null = unlimited depth
    collapsed: []                      # ACTION-… IDs of collapsed nodes at load time
