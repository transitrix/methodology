# Codex internal artefact — a policy or internal standard the org issues to itself.
# Schema: notations/elements/14-codex.md §4 + admission record (notations/CONTRACT.md §6).
# File location: codex/internal/<ID>.yaml — internal artefacts are NOT foldered by jurisdiction.
# File name: the artefact's canonical ID + .yaml — one artefact per file.

id: POLICY-FILL-ME-1                # canonical ID per IDS_AND_REFERENCES.md (POLICY | INTERNAL_STANDARD)
name: "FILL-ME policy or standard name"
type: POLICY                        # POLICY | INTERNAL_STANDARD
description: "FILL-ME — what the artefact governs"

# Admission record (CONTRACT.md §6) — admitted_at/admitted_by are computed by
# the assistant driving the onboarding skill, not hand-typed (SKILL.md
# "Admission record and lifecycle"). gate_checks.source_authority is the one
# field that IS real content the user supplies — name the actual issuing body.
zone: codex
admitted_at: "2026-01-01"           # quoted ISO 8601 date — assistant-computed
admitted_by: "FILL-ME-handle"       # assistant-computed — never left for the user to type
gate_checks:
  source_authority: "FILL-ME — name of the internal issuing body or role"

# Internal-codex frontmatter (14-codex.md §4) — codex stores the issued document only.
# Bindings to canonical entities and processes live on REQUIREMENT.derived_from
# (canon/elements/01_motivation/requirements/) and on ASSERTION (canon/assertions/);
# do NOT add an applies_to block here. See 14-codex.md §8 Migration.
issuing_authority: "FILL-ME — internal body / role that issued the artefact"
effective_date: "2026-01-01"        # quoted ISO 8601 date the artefact takes effect
