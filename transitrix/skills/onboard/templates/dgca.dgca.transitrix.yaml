# DGCA chain. Spec: notations/views/02-dgca.md
# Replace FILL-ME placeholders. IDs use the canonical grammar:
# DRIVER-N / GOAL-N / CHANGE-N / ACTIVITY-N (optional middle segments).
# To use DGA mode (no Changes column) add: view_config: { layers: { changes: off } }

id: DGCA-FILL-ME-1
name: "FILL-ME DGCA chain"
description: "FILL-ME — one-paragraph context"
period: "FILL-ME"            # e.g. "2026" or "2026-Q3"
version: "0.1"
generated_at: "YYYY-MM-DD"
author: "FILL-ME"

factors:
  - id: DRIVER-1
    name: "FILL-ME driver — neutral standing force the organisation acts on (not a finding about it)"
    type: external           # external | internal
    # category: economic     # PESTLE — external only: political | economic | social | technological | legal | environmental

goals:
  - id: GOAL-1
    name: "FILL-ME goal"
    factors: [DRIVER-1]      # which drivers motivated this goal

changes:
  - id: CHANGE-1
    name: "FILL-ME change — transformation that delivers the goal"
    goals: [GOAL-1]

activities:
  - id: ACTIVITY-1
    name: "FILL-ME activity — initiative that delivers the change"
    changes: [CHANGE-1]
