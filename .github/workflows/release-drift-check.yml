name: Release drift check

# Weekly check: if main has accumulated more than THRESHOLD commits since the
# last release tag, open a reminder issue so the release doesn't slip further.
#
# Runs every Monday at 09:00 UTC and on workflow_dispatch.
# Requires no secrets — uses GITHUB_TOKEN (read + issues:write on this repo).

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/release-drift-check.yml'
      - 'scripts/release-drift.cjs'
      - 'scripts/release-drift.test.cjs'

permissions:
  contents: read

env:
  THRESHOLD: 50

concurrency:
  group: release-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Release reminder regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release-drift.test.cjs

  check:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      issues: write
    name: Check commits since last tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count drift
        id: drift
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No tags found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git log "${LAST_TAG}..HEAD" --oneline | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Commits since $LAST_TAG: $COUNT (threshold: $THRESHOLD)"

      - name: Reconcile release reminder
        if: steps.drift.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.drift.outputs.count }}
          TAG: ${{ steps.drift.outputs.tag }}
        with:
          script: |
            const reconcile = require('./scripts/release-drift.cjs');
            await reconcile({github, context, core, env: process.env});
