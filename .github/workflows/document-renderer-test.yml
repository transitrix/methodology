name: document-renderer test

# Unit tests for @transitrix/document-renderer — the `.ttrs` recipe
# parser and its pass 1 deterministic resolver. Deterministic, no API key and no
# model: pass 1 runs with no agent present by design, so the whole suite is a
# plain Node run.
#
# The pass-1 suite renders the committed worked recipe
# (packages/document-renderer/tests/fixtures/product.mrd.ttrs) end-to-end against
# its fixture repository, and covers the no-repository cases, the named failures,
# and re-run byte-stability.
#
# The conformance suite diffs that render against the frozen
# fixtures/product.mrd.expected.md — this package is the reference
# implementation of notations/views/documents/DIRECTIVE_LANGUAGE.md, and the
# frozen output is what an independent implementation checks itself against. It
# never regenerates the fixture; a failure is a regression or a deliberate,
# separately reviewed re-freeze.
#
# Pass 2, the run record and PDF output are agent-free too: pass 2 takes the
# agent as a caller-supplied `fill` hook (never calling one itself); the run
# record is a pure function over its inputs; and PDF output is a hand-rolled,
# dependency-free Markdown-to-PDF writer (no external tool, no npm dependency)
# — every check in this workflow runs unconditionally, nothing is skipped for
# lack of an installed binary.

on:
  pull_request:
    paths:
      - 'packages/document-renderer/**'
      - 'notations/CONTRACT.md'
      - '.github/workflows/document-renderer-test.yml'
  workflow_dispatch:
  schedule:
    # Mondays 10:30 UTC — weekly safety net, offset from the other Monday crons.
    - cron: '30 10 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run recipe-parser tests
        run: node packages/document-renderer/tests/test_parse_recipe.mjs

      - name: Run pass-1 resolver tests
        run: node packages/document-renderer/tests/test_pass1.mjs

      - name: Run conformance tests (frozen fixture)
        run: node packages/document-renderer/tests/test_conformance.mjs

      - name: Run pass-2 tests (instruction-slot filling)
        run: node packages/document-renderer/tests/test_pass2.mjs

      - name: Run run-record tests
        run: node packages/document-renderer/tests/test_run_record.mjs

      - name: Run PDF-output tests
        run: node packages/document-renderer/tests/test_render_pdf.mjs

      - name: Run full-run end-to-end test
        run: node packages/document-renderer/tests/test_full_run.mjs
