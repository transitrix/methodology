name: document-view-engine test

# Unit tests for @transitrix/document-view-engine — the skeleton-file parser,
# reference resolver, evaluator, blocks view renderer and document renderer.
# Deterministic, no API key and no model: a plain Node run.
#
# The path filter deliberately covers packages/document-renderer/** as well.
# One notation, one parser: this package imports the notation's shared grammar
# (src/ids.mjs, src/syntax.mjs) from @transitrix/document-renderer rather than
# keeping its own copy, so a change over there can break the suite here. Without
# that second path, the consolidation would be a silent coupling — a grammar edit
# would run only the owning package's tests and this one would find out later.

on:
  pull_request:
    paths:
      - 'packages/document-view-engine/**'
      - 'packages/document-renderer/**'
      - 'notations/CONTRACT.md'
      - '.github/workflows/document-view-engine-test.yml'
  workflow_dispatch:
  schedule:
    # Mondays 10:45 UTC — weekly safety net, offset from the other Monday crons.
    - cron: '45 10 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run skeleton-parser tests
        run: node packages/document-view-engine/tests/test_parse_skeleton.mjs

      - name: Run reference-resolution tests
        run: node packages/document-view-engine/tests/test_resolve_references.mjs

      - name: Run evaluator tests
        run: node packages/document-view-engine/tests/test_evaluate.mjs

      - name: Run blocks-view tests
        run: node packages/document-view-engine/tests/test_blocks_view.mjs

      - name: Run render tests
        run: node packages/document-view-engine/tests/test_render.mjs
