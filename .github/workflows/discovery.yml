name: Discovery

# Realises the scheduled-trigger contract in
# RELEASING.md, "Discovery — noticing drift on a schedule".
#
# Step 1 — scan (always): for each consumer in adopters.yaml, compare its
# pinned methodology_version against the latest tag on this repo and scan its
# decision folder for status:proposed ADRs older than 14 days. Emits a digest
# to the workflow summary. No write access required.
#
# Step 2 — propose (write side, §7.2): when a consumer's pin is `behind`, open
# the bounded upgrade PR — exactly the diff §4 permits (pin bump + one
# agent-authored proposed ADR). Skips gracefully when CONSUMER_WRITE_TOKEN is
# not configured, so the read-only digest still runs.
#
# CONSUMER_WRITE_TOKEN setup (maintainer action required):
#   Create a GitHub PAT (fine-grained) with `contents:write` + `pull-requests:write`
#   on each registered consumer repo (starting with transitrix/acme-corp).
#   Add it as a repository secret named CONSUMER_WRITE_TOKEN in
#   Settings → Secrets and variables → Actions on this repo.
#   Until the secret is provisioned, step 2 exits 0 with a diagnostic message.
#
# Runs Mondays 08:00 UTC and on workflow_dispatch.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Scan and propose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (full history, for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery (read-only digest)
        run: node scripts/discovery.mjs

      - name: Propose upgrade PRs for behind consumers
        env:
          CONSUMER_WRITE_TOKEN: ${{ secrets.CONSUMER_WRITE_TOKEN }}
        run: node scripts/discovery-propose.mjs
